name: Announce

# Turns a published release into marketing copy:
#  - minor/major releases auto-post a GitHub Discussion in "Announcements"
#  - X (Twitter) and LinkedIn drafts appear in the job summary for a human to
#    copy-paste (never auto-posted to third-party networks)
#
# How it's triggered: release.yml explicitly DISPATCHES this workflow (per tag)
# right after it cuts each GitHub Release. The `release: published` event does NOT
# fire for those releases because release.yml creates them with GITHUB_TOKEN, and
# GitHub suppresses token-created events to prevent recursion: workflow_dispatch
# is the documented exception, so dispatch is the reliable path. The `release`
# trigger is kept for releases created by a human/PAT. Run by hand from the Actions
# tab (workflow_dispatch) for any tag too, with `dry_run` to rehearse: the job
# summary then shows the exact Discussion title and body and nothing is posted.
#
# Note on timing: release.yml cuts the GitHub Release at npm STAGE time: the
# package goes live only once you approve the staged version (see RELEASING.md).
# Approve promptly so the announcement and the live npm version line up.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (e.g. "geoalgeria@1.2.0")'
        required: true
      dry_run:
        description: "Dry run: render the announcement in the job summary, post nothing"
        type: boolean
        default: false

permissions:
  contents: read # read repo for announce.js
  discussions: write # create the Announcements discussion

concurrency: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Resolve tag
        id: tag
        env:
          # RAW_TAG is operator/attacker-influenceable (release name / dispatch
          # input), keep it in env, never interpolate it into a shell command.
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # Umbrella project tags (vX.Y.Z) are cut manually and announced by hand:
          # they aren't a single npm package, so the package announcer skips them.
          if printf '%s' "$RAW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Umbrella project tag $RAW_TAG: not a package release; skipping."
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed on anything that isn't one of our package tags. Match any
          # @geoalgeria/<name> scoped package (or the unscoped flagship) plus a
          # semver suffix: generic so a new package never needs this list edited
          # (the old hardcoded list silently failed jeunesse + enseignement-superieur).
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^(geoalgeria|@geoalgeria/[a-z][a-z0-9]*(-[a-z0-9]+)*)@[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to announce malformed tag: $RAW_TAG"
            exit 1
          fi
          printf 'tag=%s\n' "$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: Build announce kit
        if: steps.tag.outputs.skip != 'true'
        env:
          GEOALGERIA_TAG: ${{ steps.tag.outputs.tag }}
          GEOALGERIA_OUT: .release-notes
          # Dry run: the kit is still built and shown in the job summary, and
          # meta.json carries dryRun so the post step below stands down. Use it to
          # rehearse an announcement on an already-released tag.
          GEOALGERIA_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/announce.js

      - name: Read meta
        id: meta
        if: steps.tag.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Heredoc form keeps a multi-word/-line headline from injecting output keys.
          {
            printf 'worthy=%s\n' "$(jq -r .announceWorthy .release-notes/meta.json)"
            printf 'dry=%s\n' "$(jq -r .dryRun .release-notes/meta.json)"
            echo 'headline<<EOF'
            jq -r .headline .release-notes/meta.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post Announcements discussion (minor/major only)
        if: steps.tag.outputs.skip != 'true' && steps.meta.outputs.worthy == 'true' && steps.meta.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          HEADLINE: ${{ steps.meta.outputs.headline }}
        run: |
          set -euo pipefail
          REPO_ID=$(gh api graphql -f query='{repository(owner:"yasserstudio",name:"geoalgeria"){id}}' --jq '.data.repository.id')
          CAT_ID=$(gh api graphql -f query='{repository(owner:"yasserstudio",name:"geoalgeria"){discussionCategories(first:25){nodes{name id}}}}' \
            --jq '.data.repository.discussionCategories.nodes[] | select(.name=="Announcements") | .id')
          if [ -z "$CAT_ID" ]; then
            echo "::warning::No 'Announcements' discussion category, skipping post."
            exit 0
          fi
          # Idempotency: one announcement per tag. Re-runs and workflow_dispatch
          # must not post a second public Discussion.
          # The title is headline-only (no tag), so match the tag in title+body,
          # the body always prints "Release `<tag>`". Keeps one announcement per tag.
          #
          # This is the ONLY duplicate guard, so it has to see every Discussion in
          # the category, not the first page of them. An unpaginated first:50 starts
          # missing announcements as soon as the category holds more than 50, and
          # then posts a second public Discussion for a tag that already has one.
          # Newest first, so a re-run of a recent tag matches on page 1.
          PAGE_QUERY='
            query($catId:ID!,$cursor:String){repository(owner:"yasserstudio",name:"geoalgeria"){
              discussions(first:100,categoryId:$catId,after:$cursor,
                          orderBy:{field:CREATED_AT,direction:DESC}){
                pageInfo{hasNextPage endCursor}
                nodes{title body}}}}'
          CURSOR=""
          FOUND=""
          EXHAUSTED=""
          # 100 pages = 10,000 Discussions. The cap exists only so a lying pageInfo
          # cannot spin forever; reaching it is itself a finding.
          for _ in $(seq 1 100); do
            if [ -z "$CURSOR" ]; then
              RESP=$(gh api graphql -f catId="$CAT_ID" -f query="$PAGE_QUERY")
            else
              RESP=$(gh api graphql -f catId="$CAT_ID" -f cursor="$CURSOR" -f query="$PAGE_QUERY")
            fi
            # One jq test, no second pipe stage. The old form piped jq into
            # `grep -qF "$TAG"`, and grep -q exits on its first match while jq is
            # still writing: jq dies of SIGPIPE, `pipefail` makes the pipeline
            # 141, and the `if` reads a FOUND tag as not found, which posts a
            # second public Discussion for a tag that already has one. The tag
            # stays in env and is passed as jq data (--arg), never interpolated
            # into the jq program.
            if printf '%s' "$RESP" \
              | jq -e --arg t "$TAG" \
                  '[.data.repository.discussions.nodes[] | .title + " " + .body] | any(contains($t))' \
                  >/dev/null; then
              FOUND=yes
              break
            fi
            if [ "$(printf '%s' "$RESP" | jq -r '.data.repository.discussions.pageInfo.hasNextPage')" != "true" ]; then
              EXHAUSTED=yes
              break
            fi
            CURSOR=$(printf '%s' "$RESP" | jq -r '.data.repository.discussions.pageInfo.endCursor')
          done
          if [ -n "$FOUND" ]; then
            echo "Announcement for $TAG already exists, skipping."
            exit 0
          fi
          if [ -z "$EXHAUSTED" ]; then
            # Absence is not proven. Posting anyway risks a duplicate public
            # Discussion, which is worse than a missing one, so hand it back.
            echo "::warning::Could not read every Announcements Discussion while checking for $TAG (page cap reached). Not posting; check by hand and post from the job summary if it is missing."
            exit 0
          fi
          gh api graphql -f query='
            mutation($repoId:ID!,$catId:ID!,$title:String!,$body:String!){
              createDiscussion(input:{repositoryId:$repoId,categoryId:$catId,title:$title,body:$body}){
                discussion{url}
              }
            }' \
            -f repoId="$REPO_ID" -f catId="$CAT_ID" \
            -f title="$HEADLINE" \
            -F body=@.release-notes/announcement.md \
            --jq '.data.createDiscussion.discussion.url'

      - name: Job summary
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          WORTHY: ${{ steps.meta.outputs.worthy }}
          DRY: ${{ steps.meta.outputs.dry }}
          HEADLINE: ${{ steps.meta.outputs.headline }}
        run: |
          set -euo pipefail
          {
            if [ "$DRY" = "true" ]; then
              echo "## Announce kit for $TAG (DRY RUN, nothing posted)"
            else
              echo "## Announce kit for $TAG"
              echo "Discussion auto-posted: \`$WORTHY\` (minor/major only)"
            fi
            echo ""
            echo "### Discussion"
            echo "Title: $HEADLINE"
            echo ""
            cat .release-notes/announcement.md
            echo ""
            echo "### Social drafts"
            echo '```'
            cat .release-notes/x-thread.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
